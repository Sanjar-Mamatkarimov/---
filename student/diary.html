<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Электронный дневник — Э-Күндөлүк</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <div class="sidebar__logo">🎵</div>
        <div><strong>Э-Күндөлүк</strong><span>Музыкальная школа</span></div>
      </div>
      <nav class="sidebar__nav">
        <a class="nav-item" href="dashboard.html"><span class="nav-item__icon">🏠</span><span>Главная</span></a>
        <a class="nav-item" href="diary.html"><span class="nav-item__icon">📖</span><span>Электронный дневник</span></a>
        <a class="nav-item" href="repertoire.html"><span class="nav-item__icon">🎼</span><span>Мой репертуар</span></a>
        <a class="nav-item" href="homework.html"><span class="nav-item__icon">📁</span><span>Материалы и задания</span></a>
        <a class="nav-item" href="schedule.html"><span class="nav-item__icon">🗓️</span><span>Расписание</span></a>
      </nav>
      <div class="sidebar__foot">
        <div class="user-card">
          <div class="user-card__avatar" data-user-avatar>?</div>
          <div class="user-card__info"><strong data-user-name>Пользователь</strong><span>Ученик</span></div>
        </div>
        <button class="btn btn--ghost btn--block" id="logout-btn">Выйти</button>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <button class="topbar__menu" id="menu-btn" aria-label="Меню">☰</button>
        <div class="topbar__titles">
          <h1 class="topbar__title">Электронный дневник</h1>
          <p class="topbar__subtitle">Оценки, пропуски и комментарии учителей</p>
        </div>
        <div class="topbar__right"><span class="role-chip">Ученик</span></div>
      </header>

      <main class="content">
        <div class="page-head">
          <div>
            <h2 class="page-head__title">Электронный дневник</h2>
            <p class="muted">Успеваемость по предметам: Специальность, Сольфеджио, Хор, Оркестр и др.</p>
          </div>
        </div>
        <div class="stack" id="subject-panels"></div>
      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/mock.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/shell.js"></script>
  <script>
    (function () {
      App.shell.setup({ login: '../login.html', home: 'dashboard.html', folder: 'student' });
      if (!App.shell.guard(['STUDENT'])) return;
      App.shell.init({ title: 'Электронный дневник', subtitle: 'Оценки по предметам' });

      var panels = document.getElementById('subject-panels');

      App.shell.loadInto(panels, () => App.api.get('/api/student/grades/'), function (subjects) {
        if (!subjects.length) return App.ui.emptyState('Оценок пока нет.');
        return subjects.map(function (s) {
          var grades = s.records.filter((r) => r.grade != null).map((r) => r.grade);
          var avg = grades.length ? Math.round((grades.reduce((a, b) => a + b, 0) / grades.length) * 10) / 10 : '—';
          var absences = s.records.filter((r) => r.attendance === 'Н/Б').length;
          return App.ui.h('div', { class: 'panel' },
            App.ui.h('div', { class: 'panel__head' },
              App.ui.h('h3', null, s.subject),
              App.ui.h('div', { class: 'panel__meta' },
                App.ui.h('span', { class: 'chip' }, 'Средний: ' + avg),
                App.ui.h('span', { class: 'chip chip--warn' }, 'Пропусков: ' + absences))),
            recentTable(s.records));
        });
      });

      function recentTable(records) {
        return App.ui.h('div', { class: 'table-wrap' },
          App.ui.h('table', { class: 'table' },
            App.ui.h('thead', null, App.ui.h('tr', null,
              App.ui.h('th', null, 'Дата'), App.ui.h('th', null, 'Посещение'),
              App.ui.h('th', null, 'Оценка'), App.ui.h('th', null, 'Комментарий'))),
            App.ui.h('tbody', null, records.map(function (r) {
              return App.ui.h('tr', null,
                App.ui.h('td', null, App.ui.formatDate(r.date)),
                App.ui.h('td', null,
                  App.ui.h('span', { class: 'badge badge--' + (r.attendance === 'Б' ? 'done' : 'wip') }, r.attendance === 'Б' ? 'Был' : 'Н/Б')),
                App.ui.h('td', null, App.ui.gradeBadge(r.grade)),
                App.ui.h('td', { class: 'muted' }, r.comment || '—'));
            }))));
      }
    })();
  </script>
</body>
</html>
